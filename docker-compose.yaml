services:

  warehouse:
    container_name: warehouse_backend
    build:
      context: .
      dockerfile: Dockerfile
    depends_on:
      - warehouse_db

  warehouse_db:
    container_name: warehouse_db
    image: postgres:17
    ports:
      - "5433:5432"
    volumes:
      - warehouse_db:/var/lib/postgres/data:rw
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}

  nginx:
    image: nginx:1.26.3-alpine
    container_name: warehouse_nginx
    ports:
      - "80:80"
    volumes:
      - ./nginx/local/nginx.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - warehouse
      - warehouse_db

volumes:
  warehouse_db:
